spring.application.name=VoltMind
server.address=127.0.0.1
server.port=${VOLTMIND_BACKEND_PORT:8080}
voltmind.worker-url=${VOLTMIND_WORKER_URL:http://127.0.0.1:8765}
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=101MB
server.tomcat.max-swallow-size=101MB
spring.mvc.async.request-timeout=3600000
server.error.include-message=always
